<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Executive Dashboard | AI BI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>

<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-chart-pie me-2 text-primary"></i>AI BI Dashboard
                <span class="badge bg-primary ms-2 fw-normal" style="font-size:0.65rem;">by Shivam Wallu</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary d-none d-md-inline" id="fileBadge"></span>
                <span class="badge bg-info text-dark d-none d-md-inline" id="rowBadge"></span>
                <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="dropdown">
                    <button class="btn btn-outline-success btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-download me-1"></i>Export
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/export/csv"><i class="fas fa-file-csv me-2"></i>CSV</a></li>
                        <li><a class="dropdown-item" href="/export/excel"><i
                                    class="fas fa-file-excel me-2"></i>Excel</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="#" id="exportPdfBtn"><i class="fas fa-file-pdf me-2"></i>PDF
                                (Print)</a></li>
                    </ul>
                </div>
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-arrow-left me-1"></i>Back
                </a>
                <a href="/" class="btn btn-outline-warning btn-sm">
                    <i class="fas fa-upload me-1"></i>New File
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3 py-3">
        <!-- Filters Row -->
        <div class="card mb-3 border-0 shadow-sm filter-card">
            <div class="card-body py-2">
                <div class="row g-2 align-items-center" id="filterRow">
                    <div class="col-auto">
                        <span class="fw-semibold small text-muted"><i class="fas fa-filter me-1"></i>Filters</span>
                    </div>
                    <!-- Dynamic filter selects injected by JS -->
                    <div class="col-auto ms-auto">
                        <button class="btn btn-sm btn-outline-secondary" id="resetFilters">
                            <i class="fas fa-undo me-1"></i>Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="row g-3 mb-3" id="kpiRow">
            <!-- Injected by JS -->
        </div>

        <!-- Charts Grid -->
        <div class="row g-3 mb-3" id="chartsRow">
            <!-- Injected by JS -->
        </div>

        <!-- AI Insights & Recommendations -->
        <div class="row g-3 mb-3">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-transparent border-0 fw-bold">
                        <i class="fas fa-lightbulb text-warning me-2"></i>AI Business Insights
                    </div>
                    <div class="card-body" id="insightsList">
                        <p class="text-muted small">Loading insights…</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-transparent border-0 fw-bold">
                        <i class="fas fa-robot text-primary me-2"></i>AI Recommendations
                    </div>
                    <div class="card-body" id="recommendationsList">
                        <p class="text-muted small">Loading recommendations…</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                <span class="fw-bold"><i class="fas fa-table me-2"></i>Detailed Data</span>
                <input type="search" class="form-control form-control-sm w-auto" id="tableSearch"
                    placeholder="Search table…" />
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm mb-0" id="dataTable" style="width:100%">
                        <thead class="table-dark"></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted small border-top">
        <span id="footerDate"></span> · AI BI Dashboard · Designed & Developed by <strong>Shivam Wallu</strong> ·
        Powered by Flask & ECharts
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            // Date in DD/MM/YYYY format
            const d = new Date();
            const dd = String(d.getDate()).padStart(2, "0");
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const yyyy = d.getFullYear();
            document.getElementById("footerDate").textContent = dd + "/" + mm + "/" + yyyy;
            loadDashboard();
        });
    </script>
</body>

</html>
